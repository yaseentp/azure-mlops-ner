steps:
  - bash: |
      set -euo pipefail

      echo "===== Checking Azure CLI ====="

      if ! command -v az >/dev/null 2>&1; then
        echo "Azure CLI not found. Installing Azure CLI..."

        curl -sL https://aka.ms/InstallAzureCLIDeb | sudo bash
      else
        echo "Azure CLI is already installed."
      fi

      echo "===== Azure CLI Version ====="
      az version

      echo "===== Installing Azure ML CLI Extension ====="

      if az extension show --name ml >/dev/null 2>&1; then
        echo "Azure ML extension already exists. Updating..."
        az extension update --name ml
      else
        echo "Azure ML extension not found. Installing..."
        az extension add --name ml --yes
      fi

      echo "===== Installed Extensions ====="
      az extension list --output table

      echo "===== Verifying Azure ML CLI ====="
      az ml -h

      echo "Azure CLI and Azure ML extension are ready."

    displayName: Install Azure CLI and Azure ML Extension
