steps:
  - task: AzureCLI@2
    displayName: Install Azure ML CLI extension
    inputs:
      azureSubscription: $(ado_service_connection_aml_ws)
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(System.DefaultWorkingDirectory)
      inlineScript: |
        set -e

        echo "Azure CLI version:"
        az version

        echo "Python version:"
        az --version

        echo "Installing Azure ML extension with debug logging..."

        az extension add --name ml --yes --debug 2>&1 | tee aml-extension-install.log
