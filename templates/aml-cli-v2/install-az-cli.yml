steps:
  - task: AzureCLI@2
    displayName: Install Azure ML CLI extension
    inputs:
      azureSubscription: $(ado_service_connection_aml_ws)
      scriptType: bash
      scriptLocation: inlineScript
      workingDirectory: $(System.DefaultWorkingDirectory)
      inlineScript: |
  
        set -euo pipefail

        echo "OS:"
        cat /etc/os-release

        echo "Azure CLI:"
        az version

        echo "Azure CLI Python:"
        az --version

        echo "Installing Azure ML extension:"
        az extension add --name ml --yes --debug 2>&1 | tee aml-extension-install.log

        az extension show --name ml
        az ml -h
